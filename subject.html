<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Shelf</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><h1 id="subject-title">Lesson Shelf</h1></a>
  <a class="back-link" href="index.html">&larr; all subjects</a>
</header>

<main class="course" id="course-root">
  <!-- filled in by script -->
</main>

<script src="data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('subject');
  const subject = SUBJECTS.find(s => s.slug === slug);
  const root = document.getElementById('course-root');

  function embedUrl(id) {
    return `https://www.youtube.com/embed/${id}`;
  }

  if (!subject) {
    root.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">
      <p>Couldn't find that subject. <a href="index.html">Go back to all subjects</a>.</p>
    </div>`;
  } else if (subject.lessons.length === 0) {
    document.getElementById('subject-title').textContent = subject.name;
    root.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;">
      <p>No lessons in ${subject.name} yet — add one in data.js.</p>
    </div>`;
  } else {
    document.getElementById('subject-title').textContent = subject.name;
    document.title = `${subject.name} — Lesson Shelf`;

    root.innerHTML = `
      <nav class="lesson-list accent-${subject.accent}">
        <h2>${subject.name} lessons</h2>
        <div id="lesson-buttons"></div>
      </nav>
      <div class="player-wrap">
        <div class="player-frame">
          <iframe id="player" src="" title="lesson video" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <div class="lesson-meta">
          <h1 id="lesson-title"></h1>
          <p id="lesson-notes"></p>
        </div>
      </div>
    `;

    const btnWrap = document.getElementById('lesson-buttons');

    // ---- completed-lesson tracking (saved in the browser via localStorage) ----
    const storageKey = `lessonshelf-completed-${subject.slug}`;

    function getCompleted() {
      const raw = localStorage.getItem(storageKey);
      return raw ? JSON.parse(raw) : [];
    }

    function setCompleted(titles) {
      localStorage.setItem(storageKey, JSON.stringify(titles));
    }

    function toggleCompleted(title) {
      const completed = getCompleted();
      const i = completed.indexOf(title);
      if (i === -1) completed.push(title);
      else completed.splice(i, 1);
      setCompleted(completed);
    }

    function showLesson(index) {
      const lesson = subject.lessons[index];
      document.getElementById('player').src = embedUrl(lesson.youtubeId);
      document.getElementById('lesson-title').textContent = lesson.title;
      document.getElementById('lesson-notes').textContent = lesson.notes || '';
      [...btnWrap.querySelectorAll('.lesson-item')].forEach(el => {
        el.classList.toggle('active', Number(el.dataset.index) === index);
      });
    }

    const completedTitles = getCompleted();

    // Group lessons by period, but keep each lesson's ORIGINAL index in
    // subject.lessons so showLesson(index) and the video player still work.
    PERIODS.forEach(periodName => {
      const inThisPeriod = subject.lessons
        .map((lesson, index) => ({ lesson, index }))
        .filter(item => item.lesson.period === periodName);

      if (inThisPeriod.length === 0) return; // skip empty periods

      const heading = document.createElement('h3');
      heading.className = 'period-heading';
      heading.textContent = periodName;
      btnWrap.appendChild(heading);

      inThisPeriod.forEach(({ lesson, index }) => {
        const btn = document.createElement('div');
        btn.className = 'lesson-item';
        btn.tabIndex = 0;
        btn.dataset.index = index;
        if (completedTitles.includes(lesson.title)) btn.classList.add('done');

        btn.innerHTML = `
          <input type="checkbox" class="done-check" ${completedTitles.includes(lesson.title) ? 'checked' : ''}>
          <span>${lesson.title}</span>
        `;

        const checkbox = btn.querySelector('.done-check');
        checkbox.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCompleted(lesson.title);
          btn.classList.toggle('done');
        });

        btn.addEventListener('click', () => showLesson(index));
        btnWrap.appendChild(btn);
      });
    });

    // Lessons with a period that doesn't match anything in PERIODS
    // (typo, or not assigned yet) still show up here so nothing gets lost.
    const unsorted = subject.lessons
      .map((lesson, index) => ({ lesson, index }))
      .filter(item => !PERIODS.includes(item.lesson.period));

    if (unsorted.length > 0) {
      const heading = document.createElement('h3');
      heading.className = 'period-heading';
      heading.textContent = 'Unsorted';
      btnWrap.appendChild(heading);

      unsorted.forEach(({ lesson, index }) => {
        const btn = document.createElement('div');
        btn.className = 'lesson-item';
        btn.tabIndex = 0;
        btn.dataset.index = index;
        if (completedTitles.includes(lesson.title)) btn.classList.add('done');

        btn.innerHTML = `
          <input type="checkbox" class="done-check" ${completedTitles.includes(lesson.title) ? 'checked' : ''}>
          <span>${lesson.title}</span>
        `;

        const checkbox = btn.querySelector('.done-check');
        checkbox.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleCompleted(lesson.title);
          btn.classList.toggle('done');
        });

        btn.addEventListener('click', () => showLesson(index));
        btnWrap.appendChild(btn);
      });
    }

    showLesson(Number(params.get('lesson')) || 0);
  }
</script>

</body>
</html>
