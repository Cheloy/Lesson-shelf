<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 11th Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><h1>The 11th Library</h1></a>
  <span class="tagline">a little tutoring library</span>

  <div class="header-search">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M11.5 11.5L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input
      type="text"
      id="search-box"
      class="search-box"
      placeholder="Search all lessons..."
      autocomplete="off"
    >
    <div id="search-results" class="search-results"></div>
  </div>
</header>

<main class="shelf">
  <p class="intro">Pick a subject to see its lessons. Videos get added here whenever a new one's ready — check back anytime.</p>

  <div class="tab-grid" id="tab-grid"></div>
</main>

<script src="data.js"></script>
<script>
  const grid = document.getElementById('tab-grid');
  const tilts = [-1.2, 0.8, -0.5, 1.4, -1.6, 0.6];

  SUBJECTS.forEach((subject, i) => {
    const a = document.createElement('a');
    a.className = `tab-card accent-${subject.accent}`;
    a.href = `subject.html?subject=${encodeURIComponent(subject.slug)}`;
    a.style.setProperty('--tilt', `${tilts[i % tilts.length]}deg`);
    a.innerHTML = `
      <div class="tab-ear"></div>
      <div class="tab-body">
        <h2>${subject.name}</h2>
        <div class="count">${subject.lessons.length} lesson${subject.lessons.length === 1 ? '' : 's'}</div>
      </div>
    `;
    grid.appendChild(a);
  });

  if (SUBJECTS.length === 0) {
    grid.innerHTML = `<p style="color: rgba(32,31,38,0.6);">No subjects yet — add one in data.js.</p>`;
  }

  // ---- search across every subject's lessons ----
  const searchBox = document.getElementById('search-box');
  const resultsBox = document.getElementById('search-results');

  // Build one flat list of every lesson, remembering which subject
  // (and which position in that subject's lessons array) it came from.
  const allLessons = [];
  SUBJECTS.forEach(subject => {
    subject.lessons.forEach((lesson, index) => {
      allLessons.push({ subject, lesson, index });
    });
  });

  searchBox.addEventListener('input', () => {
    const query = searchBox.value.trim().toLowerCase();

    if (query === '') {
      resultsBox.innerHTML = '';
      resultsBox.classList.remove('open');
      return;
    }

    const matches = allLessons.filter(({ lesson }) =>
     lesson.title.toLowerCase().includes(query)
    );

    resultsBox.classList.add('open');

    if (matches.length === 0) {
      resultsBox.innerHTML = `<p class="no-results">No lessons match "${searchBox.value}".</p>`;
      return;
    }

    resultsBox.innerHTML = matches.map(({ subject, lesson, index }) => `
      <a class="result-item" href="subject.html?subject=${encodeURIComponent(subject.slug)}&lesson=${index}">
        <span class="result-subject accent-${subject.accent}">${subject.name}</span>
        <span class="result-title">${lesson.title}</span>
      </a>
    `).join('');
  });
</script>

</body>
</html>
